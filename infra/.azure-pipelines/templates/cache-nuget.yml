# Restore NuGet packages with the Azure Pipelines cache.
#
# Cache key is built from every packages.lock.json under src/ and tests/. If you
# don't have lockfiles checked in, set RestorePackagesWithLockFile=true on each
# csproj or set RestoreLockedMode=true to fail when the lockfile is missing.

parameters:
  - name: solution
    type: string
    default: 'EquineBooking.sln'

steps:
  - task: Cache@2
    displayName: 'Cache NuGet packages'
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(NUGET_PACKAGES)
    env:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages

  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: '${{ parameters.solution }}'
      feedsToUse: 'select'
      verbosityRestore: 'Minimal'
    env:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
